[workspace]
members = ["crates/telemetry", "crates/bridge", "crates/gui"]

[package]
name = "accord"
version = "0.1.0"
edition = "2024"

[dependencies]
# eldenring = { git = "https://github.com/vswarte/fromsoftware-rs.git", tag = "v0.12.0" }
eldenring = { git = "https://github.com/vswarte/fromsoftware-rs.git", branch = "feat/start-world-map-view-model" }
# fromsoftware-shared = { git = "https://github.com/vswarte/fromsoftware-rs", tag = "v0.12.0" }
fromsoftware-shared = { git = "https://github.com/vswarte/fromsoftware-rs", branch = "feat/start-world-map-view-model" }
telemetry = { path = "crates/telemetry" }
pelite = "0.10"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "z"

[lib]
crate-type = ["cdylib"]
